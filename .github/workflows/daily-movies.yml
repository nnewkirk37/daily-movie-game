name: Build movies and deploy site

on:
  push:
    branches: [main]
  schedule:
    # 03:07 UTC = about 10pm Eastern; keeps the next 7 days of movies ready.
    - cron: '7 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-movies
  cancel-in-progress: false

jobs:
  movies:
    # Code pushes only redeploy; the nightly run and the manual button also fetch movies.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build movie files
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: node scripts/build-days.mjs 7

      - name: Commit new days
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add daily movies"
            git push
          fi

  deploy:
    needs: movies
    if: always() && needs.movies.result != 'failure' && needs.movies.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stamp file versions so browsers load the new code
        # Browsers keep GitHub Pages files for 10 minutes; a new ?v= forces a fresh copy.
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html archive.html js/*.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
