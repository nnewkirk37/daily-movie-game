<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Movie Game</title>
  <meta name="description" content="Three movies a day. Name an obscure character, guess the release year, guess the IMDb score.">
  <meta name="theme-color" content="#22264B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <header class="top">
    <h1 class="wordmark">Daily Movie Game</h1>
    <nav class="top-links" aria-label="Game">
      <button class="link-btn" type="button" id="help-btn">How to play</button>
      <a href="archive.html?v=dev">Past days</a>
    </nav>
    <p class="today" id="today"></p>
    <p class="player" id="player" hidden></p>
    <p class="notice" id="notice" role="status" hidden></p>
    <ol class="progress" id="progress" aria-label="Progress"></ol>
  </header>

  <main id="app" aria-live="polite">
    <p class="status">Loading today's movies…</p>
  </main>

  <footer class="credits">
    <p>Movie data from <a href="https://www.themoviedb.org/" rel="noopener">TMDB</a> and ratings from <a href="https://www.omdbapi.com/" rel="noopener">OMDb</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>

  <template id="tpl-movie">
    <article class="ticket">
      <div class="ticket-head">
        <img class="poster" alt="">
        <div>
          <p class="ticket-count"></p>
          <h2 class="movie-title"></h2>
        </div>
      </div>
      <form class="guesses" autocomplete="off">
        <label class="field">
          <span class="field-label">Name one character in this movie</span>
          <span class="field-hint">The smaller the role, the more points. First name, last name, or nickname all count.</span>
          <input name="character" type="text" autocapitalize="words" spellcheck="false" placeholder="Character name" required>
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field-label">Release year</span>
            <input name="year" type="number" inputmode="numeric" min="1900" max="2100" placeholder="1999" required>
          </label>
          <label class="field">
            <span class="field-label">IMDb score</span>
            <input name="imdb" type="number" inputmode="decimal" min="1" max="10" step="0.1" placeholder="7.4" required>
          </label>
        </div>
        <button class="btn" type="submit">Lock in answers</button>
      </form>
      <div class="reveal" hidden></div>
    </article>
  </template>

  <script type="module" src="js/app.js?v=dev"></script>
</body>
</html>
